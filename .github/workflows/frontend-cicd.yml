
name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'dockerfiles/Dockerfile.frontend'
      - 'kubernetes/**'
      - '.github/workflows/frontend-cicd.yml'

  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./dockerfiles/Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/coderoom-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/coderoom-frontend:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes Connection
        run: |
          kubectl --context=minikube get nodes

      - name: Deploy Frontend
        run: |
          kubectl --context=minikube set image \
            -f kubernetes/coderoomdeploy.yaml \
            frontend=${{ secrets.DOCKERHUB_USERNAME }}/coderoom-frontend:${{ github.sha }} \
            --local -o yaml | kubectl --context=minikube apply -f -

          kubectl --context=minikube apply -f kubernetes/service.yaml

      - name: Verify Deployment
        run: |
          kubectl --context=minikube rollout status deployment/coderoom-frontend --timeout=180s
          kubectl --context=minikube get pods -o wide
          kubectl --context=minikube get svc
